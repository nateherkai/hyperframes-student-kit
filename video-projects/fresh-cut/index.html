    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 246.5, CLAP = 186.18, SEC2 = 105.10;

      // Ambient: slow push + marching film grain + progress bar
      tl.fromTo("#video-wrapper", { scale: 1.0 }, { scale: 1.06, duration: DUR, ease: "none" }, 0);
      tl.to("#grain", { x: -34, y: -30, duration: 0.5, ease: "steps(5)", repeat: Math.ceil(DUR / 0.5), yoyo: true }, 0);
      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);

      // Section ticker (opacity-toggled spans so it renders on seek)
      tl.set(["#tk1", "#tk2", "#tk3"], { opacity: 0 }, 0);
      tl.to("#tk1", { opacity: 1, duration: 0.5 }, 3.0);
      tl.to("#tk1", { opacity: 0, duration: 0.3 }, SEC2 - 0.4);
      tl.to("#tk2", { opacity: 1, duration: 0.5 }, SEC2 + 3.2);
      tl.to("#tk2", { opacity: 0, duration: 0.3 }, CLAP - 0.4);
      tl.to("#tk3", { opacity: 1, duration: 0.5 }, CLAP + 3.2);
      tl.to("#tk3", { opacity: 0, duration: 0.3 }, 242.2);

      // Transition flashes (tl.to -> applies on seek)
      tl.set("#flash", { opacity: 0 }, 0);
      tl.to("#flash", { opacity: 0.30, duration: 0.10, ease: "power2.out" }, SEC2 - 0.10);
      tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.in" }, SEC2);
      tl.to("#flash", { opacity: 0.55, duration: 0.10, ease: "power2.out" }, CLAP - 0.08); // the clap punch
      tl.to("#flash", { opacity: 0, duration: 0.40, ease: "power2.in" }, CLAP + 0.02);

      // --- Section 01 intro card ---
      tl.set("#card-01", { opacity: 1 }, 0);
      tl.set(["#card-01 .eyebrow", "#card-01 .card-title", "#card-01 .card-sub"], { opacity: 0, y: 30 }, 0);
      tl.set("#card-01 .accent-rule", { width: 0 }, 0);
      tl.to("#card-01 .eyebrow", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.to("#card-01 .card-title", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.to("#card-01 .accent-rule", { width: 220, duration: 0.55, ease: "power2.out" }, 0.7);
      tl.to("#card-01 .card-sub", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.85);
